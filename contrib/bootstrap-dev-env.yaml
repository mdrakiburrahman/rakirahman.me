version: '3'

vars:
  DISTRO: Ubuntu-24.04
  REPO: /workspaces/rakirahman.me

tasks:
  default:
    desc: Delete and recreate WSL, clone the current branch into it, then run the up task
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -NonInteractive -File bootstrap-dev-env.ps1
      - task: up

  up:
    desc: Install the tools and build the site in the existing WSL clone, then open it in VS Code
    platforms: [windows]
    cmds:
      - wsl -d {{.DISTRO}} --cd {{.REPO}} --exec ./contrib/bootstrap-dev-env.sh
      - code --folder-uri 'vscode-remote://wsl+{{.DISTRO}}{{.REPO}}'
